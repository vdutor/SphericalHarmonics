[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "spherical-harmonics-basis"
version = "0.0.4"
authors = [{ name = "Vincent Dutordoir", email = "vd309@cam.ac.uk" }]
description = "Python Implementation of Spherical harmonics in dimension >= 3"
readme = "README.md"
dependencies = [
    "backends>=1.8.0",
    "numpy",
    "plum-dispatch>=2.6.0",
    "scipy",
]
requires-python=">=3.10"

[project.urls]
Source = "https://github.com/vdutor/SphericalHarmonics"

[tool.flit.module]
name = "spherical_harmonics"

[tool.mypy]
ignore_missing_imports = true
strict_optional = false
allow_redefinition = true

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
skip_glob = [
    "**/__init__.py",
]
known_third_party = [
     "lab",
]
